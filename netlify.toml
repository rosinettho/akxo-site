[build]
  publish = "."
  command = "echo 'Site estatico AKXO - sem etapa de build'"

[build.environment]
  NODE_VERSION = "20"

# O repositorio tem PAGINAS REAIS (index, metodo, blog/*) e nenhum passo de
# build. Qualquer comando de npm aqui falha, porque o repo NAO tem package.json.
# Este bloco precisa continuar com o publish em "." — o Netlify publica o que
# esta na raiz do repositorio.

[[redirects]]
  from = "https://www.akxo.com.br/*"
  to = "https://akxo.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
