[build]
  publish = "."
  command = "echo 'Site estatico AKXO - sem build'"

[build.environment]
  NODE_VERSION = "20"

# Este site tem PAGINAS REAIS (index, metodo, blog/*).
# O redirect de SPA do Manus (/* -> /index.html) engolia todas elas.
# Fica apenas o espelho de www para o dominio raiz.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
