# AKXO - site estatico. Nao ha etapa de build: o que esta na raiz vai ao ar.
#
# NODE_VERSION = 18 e OBRIGATORIO: o projeto tem heranca de plugins do Manus
# (strapi-plugin-netlify-deployments -> sharp -> node-gyp) que compila codigo
# nativo e nao suporta Node 20. Fixar Node 20 quebra o deploy.
# Como nao ha nada para compilar, o Node so serve para o plugin nao quebrar.

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "https://www.akxo.com.br/*"
  to = "https://akxo.com.br/:splat"
  status = 301
  force = true
