# AKXO - site estatico. Nao ha etapa de build: o que esta na raiz vai ao ar.
#
# O projeto no Netlify tem 19 build plugins vindos do Manus (origem: ui).
# Eles NAO podem ser removidos por arquivo - so pelo painel. Enquanto
# estiverem la, o deploy precisa satisfaze-los:
#   strapi-plugin-netlify-deployments -> @strapi/plugin-upload -> sharp@0.35.5
#   sharp exige Node >= 20.9.0 (com Node 18 cai em compilacao nativa)
#   a compilacao nativa usa node-gyp 7.1.2, que abre arquivo em modo 'rU'
#   removido no Python 3.11+ (o ambiente entrega Python 3.14)
# Por isso: Node 22 (sharp instala binario pronto, sem compilar) e
# Python 3.11 (se ainda houver compilacao, node-gyp antigo funciona).

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.11"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "https://www.akxo.com.br/*"
  to = "https://akxo.com.br/:splat"
  status = 301
  force = true
