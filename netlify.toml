# AKXO — site estatico. Nao ha etapa de build: o que esta na raiz e o que
# vai ao ar. Qualquer plugin ou comando de npm aqui SO quebra o deploy.

[build]
  publish = "."
  command = ""

# Sem NODE_VERSION de proposito. O projeto tem heranca de plugins do Manus
# (strapi-plugin-netlify-deployments -> sharp -> node-gyp) que compila codigo
# nativo e exige Node <= 18. Fixar Node 20, como eu fiz antes, quebra o build.
# Como nao ha nada para compilar, nao ha por que declarar versao de Node.

[build.environment]
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "https://www.akxo.com.br/*"
  to = "https://akxo.com.br/:splat"
  status = 301
  force = true
